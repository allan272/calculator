# Tiny Tapeout project information
project:
  title:        "4-bit Educational Calculator / ALU"
  author:       "allan272"
  discord:      ""
  description:  "Educational 4-bit ALU: ripple-carry adder, two's-complement subtractor, MUX, DEMUX, D flip-flop register, and synchronous counter"
  language:     "Verilog"
  clock_hz:     50000000   # 50 MHz (20 ns period, matches config.json CLOCK_PERIOD)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_calculatorversion1"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "full_adder.v"
    - "ripple_adder.v"
    - "subtractor.v"
    - "mux.v"
    - "demux.v"
    - "dff.v"
    - "counter.v"
    - "alu.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names.
pinout:
  # Inputs
  ui[0]: "A[0] — Operand A bit 0"
  ui[1]: "A[1] — Operand A bit 1"
  ui[2]: "A[2] — Operand A bit 2"
  ui[3]: "A[3] — Operand A bit 3"
  ui[4]: "op_sel[0] — ALU operation select LSB"
  ui[5]: "op_sel[1] — ALU operation select MSB"
  ui[6]: "reg_load — load ALU result into register"
  ui[7]: ""

  # Outputs
  uo[0]: "result[0] — ALU result bit 0"
  uo[1]: "result[1] — ALU result bit 1"
  uo[2]: "result[2] — ALU result bit 2"
  uo[3]: "result[3] — ALU result bit 3"
  uo[4]: "carry_out — carry (ADD) / ~borrow (SUB)"
  uo[5]: "zero_flag — result is zero"
  uo[6]: "active_ch[0] — demux active channel bit 0"
  uo[7]: "active_ch[1] — demux active channel bit 1"

  # Bidirectional pins (all outputs: uio_oe = 0xFF)
  uio[0]: "counter[0] — 4-bit counter bit 0"
  uio[1]: "counter[1] — 4-bit counter bit 1"
  uio[2]: "counter[2] — 4-bit counter bit 2"
  uio[3]: "counter[3] — 4-bit counter bit 3"
  uio[4]: "reg_q[0] — stored register bit 0"
  uio[5]: "reg_q[1] — stored register bit 1"
  uio[6]: "reg_q[2] — stored register bit 2"
  uio[7]: "reg_q[3] — stored register bit 3"

# Do not change!
yaml_version: 6
